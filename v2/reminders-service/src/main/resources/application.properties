# Port HTTP du service (l'API Node utilise déjà 4000).
server.port=${PORT:8081}

# Connexion à la même base PostgreSQL que l'API Node.
# Les valeurs viennent des variables d'environnement DB_URL, DB_USER et
# DB_PASSWORD ; à défaut, on vise la base locale de docker-compose.
# Attention : format JDBC (jdbc:postgresql://hote:port/base), différent
# du DATABASE_URL utilisé par Node.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bibliotech}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
